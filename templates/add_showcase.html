{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white dark:bg-zinc-900 rounded-3xl shadow-sm border border-gray-100 dark:border-zinc-800 p-8">
    <h1 class="text-2xl font-black text-gray-900 dark:text-white mb-6">Add Customer Review & Delivery Showcase</h1>

    <form action="{{ url_for('add_showcase') }}" method="POST" enctype="multipart/form-data" class="space-y-6">
        <div>
            <label class="block text-xs font-semibold text-gray-700 dark:text-zinc-300 mb-2">Showcase Title / Device Sold</label>
            <input type="text" name="title" required placeholder="e.g. Delivered iPhone 14 Pro Max" class="w-full border border-gray-300 dark:border-zinc-700 rounded-xl px-4 py-3 bg-white dark:bg-black text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-[#1DB954]">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 dark:text-zinc-300 mb-2">Customer Name / Handle</label>
                <input type="text" name="customer_name" required placeholder="e.g. @chioma_k" class="w-full border border-gray-300 dark:border-zinc-700 rounded-xl px-4 py-3 bg-white dark:bg-black text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-[#1DB954]">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 dark:text-zinc-300 mb-2">Caption / Review Comment</label>
                <input type="text" name="caption" placeholder="e.g. Super fast delivery, phone came clean!" class="w-full border border-gray-300 dark:border-zinc-700 rounded-xl px-4 py-3 bg-white dark:bg-black text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-[#1DB954]">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-700 dark:text-zinc-300 mb-2">Delivery Photo or Video (Upload from Device)</label>
            <input type="file" name="media_file" required accept="image/*,video/*" class="w-full text-xs text-zinc-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-[#1DB954] file:text-black hover:file:bg-[#1ed760] cursor-pointer">
            <p class="text-[10px] text-zinc-500 mt-1">Upload a picture or video of the happy customer or delivery handover.</p>
        </div>

        <button type="submit" class="w-full bg-[#1DB954] text-black font-bold py-3.5 px-6 rounded-xl hover:bg-[#1ed760] transition shadow-sm text-sm">
            Publish Showcase Item
        </button>
    </form>
</div>
{% endblock %}
