{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white dark:bg-zinc-900 rounded-3xl shadow-sm border border-gray-100 dark:border-zinc-800 p-8">
    <h1 class="text-2xl font-black text-gray-900 dark:text-white mb-6">Add New Gadget to Inventory</h1>

    <form action="{{ url_for('add_product') }}" method="POST" enctype="multipart/form-data" class="space-y-6">
        <div>
            <label class="block text-xs font-semibold text-gray-700 dark:text-zinc-300 mb-2">Device Name</label>
            <input type="text" name="name" required placeholder="e.g. iPhone 14 Pro Max" class="w-full border border-gray-300 dark:border-zinc-700 rounded-xl px-4 py-3 bg-white dark:bg-black text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-[#1DB954]">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 dark:text-zinc-300 mb-2">Category</label>
                <select name="category" required class="w-full border border-gray-300 dark:border-zinc-700 rounded-xl px-4 py-3 bg-white dark:bg-black text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-[#1DB954]">
                    <option value="Phones">Phones</option>
                    <option value="Laptops">Laptops</option>
                    <option value="iPads">iPads & Tablets</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 dark:text-zinc-300 mb-2">Condition</label>
                <select name="condition" required class="w-full border border-gray-300 dark:border-zinc-700 rounded-xl px-4 py-3 bg-white dark:bg-black text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-[#1DB954]">
                    <option value="Brand New">Brand New</option>
                    <option value="UK Used">UK Used</option>
                    <option value="Nigeria Used">Nigeria Used</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 dark:text-zinc-300 mb-2">Price (₦)</label>
                <input type="number" step="0.01" name="price" required placeholder="e.g. 1450000" class="w-full border border-gray-300 dark:border-zinc-700 rounded-xl px-4 py-3 bg-white dark:bg-black text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-[#1DB954]">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 dark:text-zinc-300 mb-2">Storage / Specs</label>
                <textarea name="storage" rows="3" placeholder="e.g. 256GB Storage&#10;6GB RAM&#10;Battery Health: 90%" class="w-full border border-gray-300 dark:border-zinc-700 rounded-xl px-4 py-3 bg-white dark:bg-black text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-[#1DB954]"></textarea>
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-700 dark:text-zinc-300 mb-2">Main Product Image (Upload file)</label>
            <input type="file" name="main_image" accept="image/*" class="w-full text-xs text-zinc-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-[#1DB954] file:text-black hover:file:bg-[#1ed760] cursor-pointer">
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-700 dark:text-zinc-300 mb-2">Gallery Media (Multiple Pictures / Videos)</label>
            <input type="file" name="gallery_files" multiple accept="image/*,video/*" class="w-full text-xs text-zinc-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-[#1DB954] file:text-black hover:file:bg-[#1ed760] cursor-pointer">
            <p class="text-[10px] text-zinc-500 mt-1">Hold Ctrl (or Shift on mobile) to select multiple photos or videos.</p>
        </div>

        <button type="submit" class="w-full bg-[#1DB954] text-black font-bold py-3.5 px-6 rounded-xl hover:bg-[#1ed760] transition shadow-sm text-sm">
            Publish Gadget to Store
        </button>
    </form>
</div>
{% endblock %}
