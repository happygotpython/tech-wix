<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techwix - Gadget Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-black text-gray-900 dark:text-zinc-100 min-h-screen flex flex-col justify-between selection:bg-[#1DB954] selection:text-black transition-colors duration-300">
    <!-- Navigation Bar -->
    <nav class="border-b border-gray-200 dark:border-zinc-800 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="{{ url_for('index') }}" class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-xl bg-[#1DB954] flex items-center justify-center font-black text-black text-lg">T</div>
                <span class="font-black text-xl tracking-tight text-gray-900 dark:text-white">Tech<span class="text-[#1DB954]">wix</span></span>
            </a>
            
            <div class="flex items-center space-x-4">
                <a href="{{ url_for('index') }}" class="text-xs font-semibold text-zinc-600 dark:text-zinc-300 hover:text-[#1DB954] transition">Store</a>
                <!-- Shortcut Contact Us Link -->
                <a href="{{ url_for('index') }}#contact-section" class="text-xs font-semibold text-zinc-600 dark:text-zinc-300 hover:text-[#1DB954] transition">Contact Us</a>
                <a href="{{ url_for('cart') }}" class="text-xs font-semibold text-zinc-600 dark:text-zinc-300 hover:text-[#1DB954] transition flex items-center gap-1">Cart</a>
                
                <!-- Dark / Light Mode Toggle Button -->
                <button onclick="toggleTheme()" class="p-2 rounded-xl bg-zinc-100 dark:bg-zinc-900 text-zinc-700 dark:text-zinc-300 hover:text-[#1DB954] dark:hover:text-[#1DB954] border border-gray-200 dark:border-zinc-800 transition text-xs flex items-center gap-1.5" title="Toggle Theme">
                    <svg id="theme-icon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    <span class="hidden sm:inline" id="theme-text">Theme</span>
                </button>

                {% if session.get('is_admin') %}
                    <a href="{{ url_for('add_product') }}" class="text-xs font-bold text-black bg-[#1DB954] px-3 py-2 rounded-xl hover:bg-[#1ed760] transition">Add Product</a>
                    <a href="{{ url_for('admin_manage') }}" class="text-xs font-semibold text-zinc-600 dark:text-zinc-300 hover:text-[#1DB954] transition">Manage Inventory</a>
                    <a href="{{ url_for('admin_logout') }}" class="text-xs font-semibold text-red-500 hover:underline">Logout</a>
                {% else %}
                    <a href="{{ url_for('admin_login') }}" class="text-xs font-semibold text-zinc-500 dark:text-zinc-400 hover:text-[#1DB954] transition">Admin</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 dark:border-zinc-800 py-6 text-center text-xs text-zinc-500 dark:text-zinc-500">
        &copy; 2026 Techwix. All rights reserved. Built for high-performance gadgets.
    </footer>

    <!-- Theme Toggle Script -->
    <script>
        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('theme-icon');
            if (isDark) {
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>`;
            } else {
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>`;
            }
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateThemeIcon();
        }

        updateThemeIcon();
    </script>
</body>
</html>
