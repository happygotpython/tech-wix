{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-zinc-900 rounded-3xl shadow-sm border border-gray-100 dark:border-zinc-800 p-8 mt-10">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-black text-gray-900 dark:text-white">Tech<span class="text-[#1DB954]">wix</span> Admin Portal</h1>
        <p class="text-gray-400 dark:text-zinc-500 text-xs mt-1">Enter your credentials to manage inventory</p>
    </div>

    {% if error %}
    <div class="bg-red-50 dark:bg-red-950/50 text-red-600 dark:text-red-400 text-xs font-medium p-3 rounded-xl mb-4 text-center border border-red-200 dark:border-red-900">
        {{ error }}
    </div>
    {% endif %}

    <form action="{{ url_for('admin_login') }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-gray-700 dark:text-zinc-300 mb-1">Username</label>
            <input type="text" name="username" required class="w-full border border-gray-300 dark:border-zinc-700 bg-white dark:bg-black text-gray-900 dark:text-white rounded-xl px-4 py-2.5 text-xs focus:ring-2 focus:ring-[#1DB954] focus:outline-none">
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-700 dark:text-zinc-300 mb-1">Password</label>
            <input type="password" name="password" required class="w-full border border-gray-300 dark:border-zinc-700 bg-white dark:bg-black text-gray-900 dark:text-white rounded-xl px-4 py-2.5 text-xs focus:ring-2 focus:ring-[#1DB954] focus:outline-none">
        </div>

        <!-- Fixed contrast/color overlap inside the green button -->
        <button type="submit" class="w-full bg-[#1DB954] text-black font-bold py-3 rounded-xl hover:bg-[#1ed760] transition shadow-sm mt-2 text-xs">
            Login to Techwix
        </button>
    </form>
</div>
{% endblock %}
